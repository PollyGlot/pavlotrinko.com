name: Preview

# Une version du Worker par PR, servie sous l'alias pr-<n> sans déplacer le
# trafic de production : `versions upload`, jamais `deploy`. Opt-in par le
# label `preview` ; chaque push suivant rafraîchit le même alias.
#
# Dépôt public : `pull_request` et non `pull_request_target`, si bien qu'une
# PR de fork ne reçoit jamais les secrets, et le job refuse en plus toute PR
# dont la branche ne vit pas dans ce dépôt.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: preview
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'preview')
      && (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=''
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings > Secrets and variables > Actions, then re-run this job."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      # Une preview duplique le site sur workers.dev : hors index. L'en-tête
      # entre dans le bloc /* existant, car un second bloc /* remplacerait le
      # premier et ferait tomber la CSP.
      - name: Mark preview noindex
        run: |
          perl -0pi -e 's|^/\*\n|/*\n  X-Robots-Tag: noindex\n|m' dist/_headers
          grep -q 'X-Robots-Tag: noindex' dist/_headers
      - name: Upload preview version
        run: |
          pnpm exec wrangler versions upload --preview-alias "pr-$PR_NUMBER" --message "PR #$PR_NUMBER $HEAD_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
          WRANGLER_SEND_METRICS: 'false'
      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUTPUT: ${{ runner.temp }}/wrangler-output.json
        run: |
          set -euo pipefail
          url="$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$OUTPUT" | tail -n1)"
          if [ -z "$url" ]; then
            echo "::error::The version uploaded but Cloudflare returned no preview URL: Preview URLs are disabled for this Worker (preview_urls in wrangler.jsonc, applied by the next deploy from main)."
            exit 1
          fi
          marker='<!-- pr-preview -->'
          body="$(printf '%s\n**Preview** of %s: %s\n\nRefreshed on every push while the "preview" label is set.\n' "$marker" "$HEAD_SHA" "$url")"
          existing="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
